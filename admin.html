<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Portal TI</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="top"><div class="brand"><a href="index.html" class="back">←</a><div class="logo">TI</div><div><b>Portal TI</b><small>Administração</small></div></div><nav><button id="theme" class="tool">◐ Tema</button><button id="logout" class="tool" hidden>Sair</button></nav></header><main>
<section id="loginPanel" class="login-panel"><span>ÁREA RESTRITA</span><h1>Administração do Portal TI</h1><p>Entre com o usuário cadastrado no Supabase Auth para gerenciar categorias e atalhos.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Entrar</button><div id="loginMsg" class="form-msg"></div></form></section>
<section id="adminPanel" hidden><div class="admin-head"><div><span>ADMINISTRAÇÃO</span><h1>Gerenciar Portal TI</h1><p id="sessionInfo"></p></div><button id="newLink" class="primary">+ Novo atalho</button></div>
<div class="admin-grid"><aside class="panel"><h2>Categorias</h2><div id="categoryAdmin"></div><button id="newCategory" class="secondary">+ Nova categoria</button></aside><section class="panel"><div class="admin-toolbar"><div><h2>Atalhos</h2><small id="adminCount"></small></div><input id="adminSearch" placeholder="Pesquisar..." autocomplete="off"></div><div id="adminList"></div></section></div></section>
</main></div><div id="editor" class="modal" hidden><div class="modal-box"><div class="modal-head"><div><span id="editorEyebrow">NOVO ATALHO</span><h2 id="editorTitle">Cadastrar atalho</h2></div><button id="closeEditor" class="close">×</button></div><form id="linkForm"><input id="editId" type="hidden"><label>Nome<input id="linkName" required></label><label>Categoria<select id="linkCategory" required></select></label><label>Descrição<textarea id="linkDescription" rows="3"></textarea></label><label>URL / endereço interno<input id="linkUrl" required placeholder="https://... ou caminho interno"></label><label>Tipo<select id="linkType"><option value="internal">Rede / interno</option><option value="web">Web</option><option value="file">Arquivo</option></select></label><label class="check"><input id="linkActive" type="checkbox" checked> Ativo</label><div class="modal-actions"><button type="button" id="cancelEditor" class="secondary">Cancelar</button><button class="primary" type="submit">Salvar</button></div><div id="formMsg" class="form-msg"></div></form></div></div>
<div id="categoryModal" class="modal" hidden aria-hidden="true"><div class="modal-box small"><div class="modal-head"><div><span>CATEGORIA</span><h2>Nova categoria</h2></div><button id="closeCategory" class="close">×</button></div><form id="categoryForm"><label>Nome<input id="categoryName" required></label><label>Descrição<input id="categoryDescription"></label><label>Ícone<input id="categoryIcon" value="📁" maxlength="4"></label><div class="modal-actions"><button type="button" id="cancelCategory" class="secondary">Cancelar</button><button class="primary">Salvar</button></div><div id="categoryMsg" class="form-msg"></div></form></div></div>
<div id="toast" class="toast" hidden></div><script src="js/data.js"></script><script src="js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/admin.js"></script></body></html>
