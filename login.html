<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>Área Restrita — Portal TI Xanxerê</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .login-shell {
      width: min(420px, 92vw);
    }

    .login-shell .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .login-shell .back-link:hover {
      color: var(--accent);
    }

    .login-panel {
      margin: 0;
    }

    .login-panel .primary {
      width: 100%;
      margin-top: 4px;
    }

    #themeFloat {
      position: fixed;
      top: 18px;
      right: 18px;
    }
  </style>
</head>

<body class="login-body">

  <button id="themeFloat" class="tool tool-icon" type="button" title="Alterar tema" aria-label="Alterar tema">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 2.5V4M12 20V21.5M2.5 12H4M20 12H21.5M5.3 5.3L6.4 6.4M17.6 17.6L18.7 18.7M18.7 5.3L17.6 6.4M6.4 17.6L5.3 18.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="login-shell">

    <a href="index.html" class="back-link">← Voltar ao site</a>

    <section class="login-panel">

      <span>ÁREA RESTRITA</span>

      <h1>Acesso ao Portal Interno</h1>

      <p>Entre com seu usuário institucional cadastrado no Supabase para acessar o painel de sistemas da equipe de TI.</p>

      <form id="loginForm">

        <label>
          Usuário / E-mail
          <input id="email" type="email" required autocomplete="username" placeholder="seu.usuario@unoesc.edu.br">
        </label>

        <label>
          Senha
          <input id="password" type="password" required autocomplete="current-password" placeholder="Digite sua senha">
        </label>

        <button class="primary" type="submit">Entrar no Painel</button>

        <div id="loginMsg" class="form-msg"></div>

      </form>

    </section>

  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
